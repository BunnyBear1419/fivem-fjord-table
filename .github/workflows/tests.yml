name: FiveM Crafting Bot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivem-crafting-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install bot and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile Python
        run: python -m compileall -q bot.py crafting.py enhancements.py

      - name: Run FiveM crafting tests
        run: python -m pytest -q tests
