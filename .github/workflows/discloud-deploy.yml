name: FiveM Crafting Bot — Discloud Deploy

on:
  workflow_run:
    workflows: ["FiveM Crafting Bot Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivem-crafting-discloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FiveM crafting bot to Discloud
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Create Discloud bot bundle
        run: zip deploy.zip bot.py crafting.py recipes.json discloud.config requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: Install official Discloud SDK
        run: npm install --no-save discloud.app

      - name: Deploy bot to existing Discloud app
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          test -n "$DISCLOUD_TOKEN"
          node <<'NODE'
          const { discloud } = require("discloud.app");

          async function main() {
            await discloud.login(process.env.DISCLOUD_TOKEN);
            const apps = await discloud.apps.fetch("all");
            const entries = [...apps.entries()];
            const target = entries.find(([, app]) => app.name === "AsphaltRedeemBot");

            if (!target) {
            throw new Error("Could not find the existing Discloud app named AsphaltRedeemBot; refusing to create a duplicate.");
            }

           console.log("Found existing AsphaltRedeemBot:", target[0]);

           await discloud.apps.update(target[0], { file: "./deploy.zip" });
            console.log(`Discloud app ${target[0]} updated successfully.`);
          }

          main().catch((error) => {
            console.error("Discloud deployment failed:", error?.message || error);
            process.exit(1);
          });
          NODE
