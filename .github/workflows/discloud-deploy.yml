name: FiveM Crafting Bot — Discloud Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivem-crafting-discloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FiveM crafting bot to Discloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Python and verify source before deployment
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compile and run tests before deployment
        run: |
          python -m compileall -q bot.py crafting.py enhancements.py storage.py hybrid_ai.py game_guides.py
          python -m pytest -q tests

      - name: Create Discloud bot bundle
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          test -n "$DISCORD_BOT_TOKEN" || {
            echo "ERROR: DISCORD_BOT_TOKEN GitHub secret is missing."
            exit 1
          }
          printf 'DISCORD_BOT_TOKEN=%s\n' "$DISCORD_BOT_TOKEN" > .env
          zip deploy.zip bot.py crafting.py enhancements.py storage.py hybrid_ai.py game_guides.py recipes.json discloud.config requirements.txt .env
          rm -f .env

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: Install official Discloud SDK
        run: npm install --no-save discloud.app

      - name: Deploy bot to existing Discloud app
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          test -n "$DISCLOUD_TOKEN" || {
            echo "ERROR: DISCLOUD_TOKEN GitHub secret is missing."
            exit 1
          }
          node <<'NODE'
          const { discloud } = require("discloud.app");

          async function main() {
            await discloud.login(process.env.DISCLOUD_TOKEN);
            const apps = await discloud.apps.fetch("all");
            const entries = [...apps.entries()];
            const target = entries.find(([, app]) => app.name === "CraftingBot");

            if (!target) {
              throw new Error("Could not find the existing Discloud app named CraftingBot; refusing to create a duplicate.");
            }

            console.log("Found existing CraftingBot:", target[0]);
            await discloud.apps.update(target[0], { file: "./deploy.zip" });
            console.log(`Discloud app ${target[0]} updated successfully.`);
          }

          main().catch((error) => {
            console.error("Discloud deployment failed:", error?.message || error);
            process.exit(1);
          });
          NODE
