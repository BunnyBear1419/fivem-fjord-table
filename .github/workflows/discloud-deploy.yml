name: Discloud Deployment (Paused During Website Migration)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment pause
        run: |
          echo "Automatic production deployment is paused while the repository is converted to the FiveM Crafting Directory."
          echo "Re-enable deployment after the Discloud site ID, plan, and site configuration are confirmed."
